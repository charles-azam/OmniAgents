name: Test LLM

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv sync

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Pull Docker image for tests
      run: |
        docker pull ghcr.io/astral-sh/uv:debian

    - name: Run LLM tests
      env:
        ANYAGENTS_BUCKET_NAME: ${{ secrets.ANYAGENTS_BUCKET_NAME }}
        ANYAGENTS_GITHUB_API_KEY: ${{ secrets.ANYAGENTS_GITHUB_API_KEY }}
        ANYAGENTS_GITHUB_STATE_REPO: ${{ secrets.ANYAGENTS_GITHUB_STATE_REPO }}
        CI_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
          uv run pytest tests -vvvv -m "llm"
