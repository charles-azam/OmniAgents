name: Test All Backends

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv sync

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Pull Docker image for tests
      run: |
        docker pull ghcr.io/astral-sh/uv:debian

    - name: Set up E2B API key
      env:
        E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      run: |
        if [ -n "$E2B_API_KEY" ]; then
          echo "E2B_API_KEY=${E2B_API_KEY}" >> $GITHUB_ENV
        else
          echo "Warning: E2B_API_KEY not set. E2B tests may fail."
        fi

    - name: Run tests
      env:
        BUCKET_PROMPT_TO_DRAFT: ${{ secrets.BUCKET_PROMPT_TO_DRAFT }}
        E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      run: |
          uv run pytest tests -vvvv



