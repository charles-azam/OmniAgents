[project]
name = "prompttodraft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charles Azam", email = "azamcharles0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cadquery>=2.6.0",
    "pydantic>=2.12.0",
    "smolagents[telemetry,toolkit]",
    "e2b-code-interpreter>=1.0.0",
    "pydantic-ai[examples]>=1.25",
    "langchain>=1.1",
    "langchain-openai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-xai>=0.2.0",
    "langsmith>=0.2.0",
    "huggingface-hub>=0.20.0",
    "openai-agents>=0.3.3",
    "litellm>=1.78.2",
    "pytest>=8.4.2",
    "ipykernel>=7.0.1",
    "google-api-python-client>=2.179.0",
    "google-cloud-secret-manager>=2.24.0",
    "google-cloud-storage>=3.3.0",
    "loguru>=0.7.3",
    "docker>=7.1.0",
    "pygithub>=2.5.0",
    "beartype>=0.22.7",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[project.scripts]
prompttodraft = "prompttodraft:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
markers = [
    "e2b: marks tests that require E2B backend (deselect with '-m \"not e2b\"')",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
show_error_context = true
pretty = true
exclude = [
    "src/prompttodraft/benchmark/tasks/.*",
]

[[tool.mypy.overrides]]
module = [
    "cadquery.*",
    "smolagents.*",
    "e2b.*",
    "pydantic_ai.*",
    "langchain.*",
    "langchain_openai.*",
    "langchain_huggingface.*",
    "langchain_xai.*",
    "langsmith.*",
    "huggingface_hub.*",
    "openai_agents.*",
    "litellm.*",
    "google.*",
    "googleapiclient.*",
    "google.cloud.*",
    "docker.*",
    "github.*",
    "beartype.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.workspace]
members = [
    "data/test_init_local",
    "data/test_init_local/test_subproject",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
