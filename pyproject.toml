[project]
name = "prompttodraft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charles Azam", email = "azamcharles0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cadquery>=2.6.0",
    "pydantic>=2.12.0",
    "smolagents[telemetry,toolkit] @ git+https://github.com/huggingface/smolagents.git@main",
    "e2b-code-interpreter>=1.0.0",
    "pydantic-ai[examples]>=1.1.0",
    "langchain>=0.3.27",
    "langchain-openai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-xai>=0.2.0",
    "huggingface-hub>=0.20.0",
    "openai-agents>=0.3.3",
    "litellm>=1.78.2",
    "pytest>=8.4.2",
    "ipykernel>=7.0.1",
    "google-api-python-client>=2.179.0",
    "google-cloud-secret-manager>=2.24.0",
    "google-cloud-storage>=3.3.0",
    "loguru>=0.7.3",
]

[project.scripts]
prompttodraft = "prompttodraft:main"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
