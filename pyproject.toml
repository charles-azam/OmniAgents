[project]
name = "prompttodraft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charles Azam", email = "azamcharles0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cadquery>=2.6.0",
    "pydantic>=2.12.0",
    "smolagents>=1.22.0",
    "e2b-code-interpreter>=1.0.0",
    "pydantic-ai[examples]>=1.1.0",
]

[project.scripts]
prompttodraft = "prompttodraft:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
