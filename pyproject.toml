[project]
name = "omniagents"
version = "0.1.0"
description = "A multi-backend execution framework for AI coding agents. Use any agent framework with any runtime."
readme = "README.md"
authors = [
    { name = "Charles Azam", email = "azamcharles0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # Core dependencies (required)
    "pydantic>=2.12.0",
    "beartype>=0.22.7",
    "loguru>=0.7.3",
    "docker>=7.1.0",
    # Agent frameworks
    "smolagents[telemetry,toolkit]",
    "pydantic-ai[examples]>=1.25",
    "langchain>=1.1",
    "langchain-openai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-xai>=0.2.0",
    "langsmith>=0.2.0",
    "huggingface-hub>=0.20.0",
    "openai-agents>=0.3.3",
    "litellm>=1.78.2",
    # Cloud storage
    "google-api-python-client>=2.179.0",
    "google-cloud-secret-manager>=2.24.0",
    "google-cloud-storage>=3.3.0",
    "pygithub>=2.5.0",
    # Dev tools
    "pytest>=8.4.2",
    "ipykernel>=7.0.1",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pyinstrument>=5.1.1",
]

[project.optional-dependencies]
# OpenHands integration - use OpenHands runtimes with omniagents
openhands = [
    "openhands-ai>=0.27.0",
]
# E2B sandbox backend
e2b = [
    "e2b-code-interpreter>=1.0.0",
]
# CAD tools (cadquery)
cad = [
    "cadquery>=2.6.0",
]
# All optional dependencies
all = [
    "openhands-ai>=0.27.0",
    "e2b-code-interpreter>=1.0.0",
    "cadquery>=2.6.0",
]

[project.scripts]
omniagents = "omniagents:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/omniagents"]

[tool.pytest.ini_options]
markers = [
    "e2b: marks tests that require E2B backend (deselect with '-m \"not e2b\"')",
    "llm: marks tests that call LLM APIs (deselect with '-m \"not llm\"')",
]

[tool.uv.workspace]
members = [
    "data/test_init_local",
    "data/test_init_local/test_subproject",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
